<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>StandStrong — Interactive Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Tether design tokens — 1:1 with src/tokens.ts light theme */
        --bg: #ffffff;
        --sunken: #f7fafc;
        --muted-surface: #edf2f7;
        --border: #e2e8f0;
        --border-strong: #cbd5e0;
        --text: #1a202c;
        --text-muted: #718096;
        --text-subtle: #a0aec0;
        --accent: #2b6cb0;
        --accent-hover: #1a4a80;
        --accent-soft: #ebf8ff;
        --success: #1a6645;
        --success-soft: #f0fff4;
        --warning: #92400e;
        --warning-soft: #fffbeb;
        --danger: #c53030;
        --danger-soft: #fff5f5;
        --purple: #553c9a;
        --pink: #97266d;
        --warning-deep: #744210;
      }

      * {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #0f1419;
        color: var(--text);
        overflow: hidden;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <script type="text/babel" src="data.jsx"></script>
    <script type="text/babel" src="primitives.jsx"></script>
    <script type="text/babel" src="screens-onboarding.jsx"></script>
    <script type="text/babel" src="screens-tabs.jsx"></script>
    <script type="text/babel" src="app.jsx"></script>
  </body>
</html>
