<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>StandStrong — Desktop Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --sunken: #F7FAFC;
    --muted-surface: #EDF2F7;
    --border: #E2E8F0;
    --border-strong: #CBD5E0;
    --text: #1A202C;
    --text-muted: #718096;
    --text-subtle: #A0AEC0;
    --accent: #2B6CB0;
    --accent-hover: #1A4A80;
    --accent-soft: #EBF8FF;
    --success: #1A6645;
    --success-soft: #F0FFF4;
    --warning: #92400E;
    --warning-soft: #FFFBEB;
    --danger: #C53030;
    --danger-soft: #FFF5F5;
    --purple: #553C9A;
    --pink: #97266D;
    --warning-deep: #744210;

    /* Desktop-only additions */
    --nav-h: 64px;
    --content-narrow: 560px;
    --content-mid: 960px;
    --content-wide: 1200px;
    --paper: #FDFBF7;
    --ink-soft: #2D3748;
  }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body {
    margin: 0; padding: 0;
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--sunken);
    color: var(--text);
    min-height: 100vh;
  }
  #root { min-height: 100vh; display: flex; flex-direction: column; }

  /* Subtle page-load rise */
  @keyframes stand-rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0);   }
  }
  .rise   { animation: stand-rise 520ms cubic-bezier(.2,.7,.2,1) both; }
  .rise-1 { animation-delay: 60ms;  }
  .rise-2 { animation-delay: 140ms; }
  .rise-3 { animation-delay: 220ms; }
  .rise-4 { animation-delay: 300ms; }

  /* Newsreader accent for editorial moments */
  .editorial { font-family: Newsreader, Georgia, serif; font-weight: 400; font-style: italic; }

  /* Link + button resets */
  button { font-family: inherit; }
  a { color: inherit; }

  /* Hoverable card */
  .hoverable { transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease; }
  .hoverable:hover { transform: translateY(-1px); border-color: var(--border-strong); box-shadow: 0 6px 20px rgba(20,30,50,0.06); }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <!-- Shared with mobile prototype -->
  <script type="text/babel" src="../data.jsx"></script>
  <script type="text/babel" src="../primitives.jsx"></script>
  <!-- Desktop-only shell + screens -->
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="screens-onboarding.jsx"></script>
  <script type="text/babel" src="screens-tabs.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
